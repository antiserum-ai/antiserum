name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: make test
      - name: Reproduce toy scan
        run: antiserum scan corpus/toy
      - name: Reproduce toy first-pass
        run: antiserum judge corpus/toy --out judgments.json
      - name: Reproduce reference corpus
        run: make reproduce
      - name: Eval reference corpus
        run: make eval

  # Dogfood the reusable Action so scan.yml cannot rot.
  # corpus/toy has planted flags; default fail-on is never, so the job stays green.
  scan-action:
    uses: ./.github/workflows/scan.yml
    with:
      path: corpus/toy
