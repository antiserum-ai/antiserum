# Publish sdist + wheel to PyPI on a version tag (vX.Y.Z).
# Trusted publisher (OIDC). No long-lived PyPI token in the repo.
# PyPI is distribution only. The CLI stays offline.
#
# One-time maintainer click (pending publisher, before the first tag):
#   https://pypi.org/manage/account/publishing/
#   project: antiserum
#   owner: antiserum-ai
#   repo: antiserum
#   workflow: publish.yml
#   environment: pypi
#
name: publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import pathlib; ns={'__name__': 'antiserum'}; exec(pathlib.Path('src/antiserum/__init__.py').read_text(), ns); print(ns['__version__'])")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Install build
        run: python3 -m pip install build

      - name: Build sdist and wheel
        run: python3 -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/antiserum
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
