[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antiserum"
dynamic = ["version"]
description = "Antivirus for training data. A local CLI that flags poison in text datasets."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Antiserum contributors" }]
keywords = ["training-data", "dataset", "poison", "scanner", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]
hf = [
    "pyarrow>=14",
]

[project.scripts]
antiserum = "antiserum.cli:entry"

[project.urls]
Homepage = "https://github.com/antiserum-ai/antiserum"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "antiserum.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Pin the classic default. Bare [tool.ruff] in current ruff enables a much
# larger rule set that would rewrite existing scanner code for style only.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["antiserum"]

[tool.coverage.report]
show_missing = true
